name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'editions/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ship plugins from the latest tag
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "Pinning plugins/ to $tag"
          git checkout "$tag" -- plugins/

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build wiki
        run: |
          rm -rf editions/site/plugins
          cp -r plugins editions/site/plugins
          npx tiddlywiki ./editions/site --output ./output --build single-file
          mv output/single-file.html output/index.html

      - name: Build plugin library
        run: |
          mkdir -p /tmp/lib/plugins/yan
          cp -r plugins/hypergsd* /tmp/lib/plugins/yan/
          node scripts/stage-plugin-json.js \
            'editions/site/tiddlers/$__plugins_flibbles_relink.json' \
            'editions/site/tiddlers/$__plugins_kookma_trashbin.json' \
            'editions/plugin-library/thirdparty/$__plugins_euth_drawers.json' \
            --out /tmp/lib/plugins
          TIDDLYWIKI_PLUGIN_PATH=/tmp/lib/plugins npx tiddlywiki ./editions/plugin-library --build library

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - uses: actions/deploy-pages@v5
        id: deployment
